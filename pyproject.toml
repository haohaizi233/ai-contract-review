[project]
name = "contract-kb"
version = "0.1.0"
description = "Enterprise IP contract template knowledge base & AI review engine"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "lxml>=5.0",
    "pydantic>=2.6",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["contract_kb*"]
