[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-kb"
version = "0.3.0"
description = "Enterprise IP contract template knowledge base & AI review engine"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "lxml>=5.0",
    "pydantic>=2.6",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pillow>=10.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9",
    "pglast>=6.0",
]
integrations = [
    "python-tds>=1.15",
    "minio>=7.2",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "pillow>=10.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "pglast>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/wecom_wedrive_probe/tests"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "real_corpus: requires authorized private corporate contract templates (CONTRACT_KB_REAL_CORPUS=1)",
    "real_model: requires authorized LLM endpoint credentials (CONTRACT_KB_REAL_LLM_*)",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["contract_kb*"]
