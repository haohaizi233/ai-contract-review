name: contract-kb-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_real_corpus:
        description: "受控环境：触发真实语料回归（仅 self-hosted + environment: controlled）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked/dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps
          python -m pip check
      - name: Ruff lint
        run: ruff check . --select=E,F,W --ignore=E501
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy（核心模块）
        run: mypy contract_kb --ignore-missing-imports --no-error-summary

  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 结构性安全检查（零外部依赖，始终执行）
        run: |
          set -euo pipefail
          if find contract_kb tests -name "*.docx" -not -path "tests/fixtures/*" | grep -q .; then
            echo "::error::代码目录不得包含 DOCX 合同文件"; exit 1
          fi
          for p in "参考" "_tools" "data"; do
            if git ls-files "$p" | grep -q .; then
              echo "::error::受控数据目录不得入库：$p"; exit 1
            fi
          done
          if git ls-files "*.docx" | grep -q .; then
            echo "::error::仓库不得包含任何 DOCX 合同文件"; exit 1
          fi
          if ! grep -rq "real_corpus" tests/conftest.py; then
            echo "::error::缺少真实语料受控标记机制"; exit 1
          fi
          echo "结构性检查通过"
      - name: 内置凭据与私钥特征扫描（全目录覆盖含 tools/ 与 scripts/）
        run: |
          set -euo pipefail
          BUILTIN_PATTERNS='BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|ww(?!0000000000000000)[0-9a-f]{16}|s\.w[0-9a-f]{16}\.[0-9A-Za-z_-]{16,}|mysql(\.exe)?\s+.*-p[^<$\s{"'\'']{4,}'
          set +e
          out=$(grep -rnP "$BUILTIN_PATTERNS" contract_kb tests tools scripts docs README.md reports 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::发现疑似硬编码凭据/私钥/企微标识或命令行明文密码，CI 阻断"
            echo "$out" | cut -d: -f1,2 | sort -u | head -20
            exit 1
          fi
          if [ "$rc" -gt 1 ]; then
            echo "::error::内置凭据扫描执行失败：$out"
            exit 1
          fi
          echo "内置凭据特征扫描通过（零命中）"
      - name: 企业敏感实体精确扫描（支持受控 Secret 注入）
        env:
          SENSITIVE_MARKERS: ${{ secrets.SENSITIVE_MARKERS }}
          REQUIRE_SENSITIVE_MARKERS: ${{ vars.REQUIRE_SENSITIVE_MARKERS_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SENSITIVE_MARKERS:-}" ]; then
            if [ "${REQUIRE_SENSITIVE_MARKERS:-0}" = "1" ]; then
              echo "::error::已启用 REQUIRE_SENSITIVE_MARKERS_SECRET=1 但 SENSITIVE_MARKERS 未配置，fail-closed 阻断"
              exit 1
            fi
            echo "::notice::未配置仓库级 SENSITIVE_MARKERS Secret，已完成内置凭据特征扫描；企业仓库建议配置 SENSITIVE_MARKERS 并开启 REQUIRE_SENSITIVE_MARKERS_SECRET=1"
            exit 0
          fi
          set +e
          out=$(grep -rnE "$SENSITIVE_MARKERS" contract_kb tests tools scripts docs README.md reports 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::发现真实企业敏感信息字面量，CI 阻断（命中内容已脱敏隐藏）"
            echo "$out" | cut -d: -f1,2 | sort -u | head -20
            exit 1
          fi
          if [ "$rc" -gt 1 ]; then
            echo "::error::敏感扫描工具执行失败（fail-closed）：$out"
            exit 1
          fi
          echo "企业敏感实体精确扫描通过（零命中）"

  test-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 单元/契约/集成/安全/API 全量测试（合成语料 + 微盘探针）
        run: python -m pytest tests tools/wecom_wedrive_probe/tests -q --junitxml=report.xml
      - name: 知识库导入测试（合成语料）
        run: |
          python -m contract_kb.evaluation.datasets.synthetic
          CONTRACT_KB_TEMPLATE_DIR=tests/fixtures/synth_corpus python -m contract_kb.cli import
      - name: SQL 迁移语法测试
        run: python -m pytest tests/test_pg_migration.py tests/test_pg_storage.py -q
      - name: 检索评估（合成基准）
        run: python -m contract_kb.evaluation.retrieval.benchmark_retrieval
      - name: 审核回归（黄金变异样本）
        run: python -m pytest tests/test_review.py tests/test_format_diff.py tests/test_compare_semantics.py -q
      - name: 上传测试报告（7天自动过期防额度耗尽）
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: report.xml
          retention-days: 7
          if-no-files-found: warn

  test-pg:
    runs-on: ubuntu-latest
    services:
      pg:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contract_kb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: PostgreSQL + pgvector 行为测试（真实实例）
        env:
          CONTRACT_KB_TEST_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/contract_kb_test
        run: |
          python -m pytest tests/test_pg_storage.py tests/test_pg_migration.py tests/integration/test_uow_and_pg18_relational.py -q --junitxml=report-pg.xml
      - name: 上传 PG 测试报告（仅失败时上传，7天过期）
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: junit-report-pg
          path: report-pg.xml
          retention-days: 7
          if-no-files-found: warn

  real-corpus-regression:
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_corpus
    runs-on: self-hosted
    environment: controlled
    steps:
      - uses: actions/checkout@v4
      - name: 受控真实语料回归（日志脱敏）
        env:
          CONTRACT_KB_REAL_CORPUS: "1"
          CONTRACT_KB_TEMPLATE_DIR: ${{ secrets.REAL_TEMPLATE_DIR }}
        run: |
          python -m pytest tests -m real_corpus -q --tb=no -x

  pr-ci-gate:
    name: pr-ci-gate-enforce
    runs-on: ubuntu-latest
    needs: [lint-and-type, security-gate, test-synthetic, test-pg]
    if: always()
    steps:
      - name: Enforce CI Passing Gate for Pull Requests
        run: |
          set -euo pipefail
          echo "Checking status of all upstream CI gate jobs..."
          FAILED_JOBS=()
          
          if [ "${{ needs.lint-and-type.result }}" != "success" ]; then
            FAILED_JOBS+=("lint-and-type (status: ${{ needs.lint-and-type.result }})")
          fi
          
          if [ "${{ needs.security-gate.result }}" != "success" ]; then
            FAILED_JOBS+=("security-gate (status: ${{ needs.security-gate.result }})")
          fi
          
          if [ "${{ needs.test-synthetic.result }}" != "success" ]; then
            FAILED_JOBS+=("test-synthetic (status: ${{ needs.test-synthetic.result }})")
          fi
          
          if [ "${{ needs.test-pg.result }}" != "success" ]; then
            FAILED_JOBS+=("test-pg (status: ${{ needs.test-pg.result }})")
          fi
          
          if [ ${#FAILED_JOBS[@]} -gt 0 ]; then
            echo "::error::========================================================"
            echo "::error::[CI GATE BLOCKED] 以下前置必要 CI Job 未能通过："
            for f in "${FAILED_JOBS[@]}"; do
              echo "::error::  - $f"
            done
            echo "::error::依据企业研发红线门禁规范：CI 不过，严禁支持或合入 PR！"
            echo "::error::========================================================"
            exit 1
          fi
          
          echo "========================================================"
          echo "[CI GATE APPROVED] 全部前置 CI 检查（代码格式、类型校验、安全扫描、单元/集成/PG测试）100% 通过！"
          echo "准入条件满足，允许合入 PR。"
          echo "========================================================"
